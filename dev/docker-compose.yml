name: ttcal-dev

# Local development environment for ttcal.
# Not for production: credentials are trivial and both services bind to localhost.
#
#   TimeTagger UI/API : http://localhost:1081/          (API base: /api/v2/)
#   Radicale CalDAV   : http://localhost:5232/          (user: test / test)
#
# Start with: make dev-up

services:
  timetagger:
    image: ghcr.io/almarklein/timetagger:latest
    ports:
      - "127.0.0.1:1081:80"
    volumes:
      - ./timetagger:/root/_timetagger
    environment:
      - TIMETAGGER_BIND=0.0.0.0:80
      - TIMETAGGER_DATADIR=/root/_timetagger
      - TIMETAGGER_LOG_LEVEL=info
      # test:test
      - TIMETAGGER_CREDENTIALS=test:$$2a$$08$$0CD1NFiIbancwWsu3se1v.RNR/b7YeZd71yg3cZ/3whGlyU6Iny5i
    restart: unless-stopped

  radicale:
    image: tomsquest/docker-radicale:latest
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - ./radicale/data:/data
      - ./radicale/config:/config:ro
    restart: unless-stopped
