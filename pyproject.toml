[project]
name = "ttcal"
version = "0.1.0"
description = "Two-way mirror between TimeTagger records and a CalDAV calendar"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ttcal contributors" }]
keywords = ["timetagger", "caldav", "radicale", "time-tracking", "calendar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "caldav>=1.3",
    "vobject>=0.9.6",
    "requests>=2.31",
    "urllib3>=1.26",
]

[project.urls]
# Replace with the published repository URL when the project goes public.
Repository = "https://github.com/jeffreytigch/ttcal"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
ttcal = "ttcal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttcal"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The caldav library and vobject raise broad exceptions; wrapping them in a
# domain error is intentional.
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: integration tests that need the local Docker dev stack",
]
